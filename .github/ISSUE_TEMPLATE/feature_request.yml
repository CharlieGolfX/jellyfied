name: Feature request
description: Suggest something Jellyfied could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The situation you are in and what is missing, rather than only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
      description: A sketch of the behaviour. For larger changes, this is where we agree on the approach before code is written.
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: How the Jellyfin web client or another app does it, screenshots, …

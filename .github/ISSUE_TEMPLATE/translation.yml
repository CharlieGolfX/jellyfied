name: Translation
description: A text that reads wrong in your language, or a language you would like to add
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      description: For example Norwegian Bokmål (nb), Spanish (es-ES), or a new one.
    validations:
      required: true
  - type: textarea
    id: texts
    attributes:
      label: Which texts?
      description: What the app shows now, where in the app it appears, and what it should say instead. A screenshot helps.
    validations:
      required: true
  - type: textarea
    id: other
    attributes:
      label: Anything else
      description: Whether you would like to make the change yourself in a pull request (see CONTRIBUTING.md), or anything else.

# Jellyplex — Plex-style frontend for an existing Jellyfin server.
#
#   cp .env.example .env      (then set JELLYFIN_URL in .env)
#   docker compose up -d      →   http://localhost:8080
#
# All addresses and ports come from .env, which is not committed to git. See .env.example.
#
services:
  jellyplex:
    build: .
    image: jellyplex:latest
    container_name: jellyplex
    restart: unless-stopped
    ports:
      - "${JELLYPLEX_BIND_ADDRESS:-0.0.0.0}:${JELLYPLEX_HOST_PORT:-8080}:80"
    environment:
      # Jellyfin address as reachable FROM THIS CONTAINER (proxied at /jellyfin).
      JELLYFIN_URL: "${JELLYFIN_URL:-}"
      # Optional: make the browser talk to Jellyfin directly instead of through the proxy.
      JELLYFIN_PUBLIC_URL: "${JELLYFIN_PUBLIC_URL:-}"
      # Optional: whether users can type a different server address on the login screen.
      JELLYPLEX_LOCK_SERVER: "${JELLYPLEX_LOCK_SERVER:-}"
    extra_hosts:
      # Makes host.docker.internal work on Linux too.
      - "host.docker.internal:host-gateway"

  # If Jellyfin runs in Docker as well, put both on the same network and set
  # JELLYFIN_URL=http://jellyfin:8096 in .env, e.g.:
  #
  # jellyfin:
  #   image: jellyfin/jellyfin:latest
  #   container_name: jellyfin
  #   restart: unless-stopped
  #   ports:
  #     - "8096:8096"
  #   volumes:
  #     - ./jellyfin/config:/config
  #     - ./jellyfin/cache:/cache
  #     - /path/to/media:/media:ro

# Jellyfied — Plex-style frontend for an existing Jellyfin server.
#
#   docker compose up -d   →   http://localhost:8080
#
# The defaults below expect Jellyfin on the Docker host, port 8096. To change them, either edit
# this file or put your own values in a .env file next to it (see .env.example).
#
services:
  jellyfied:
    build: .
    image: jellyfied:latest
    container_name: jellyfied
    restart: unless-stopped
    ports:
      - '${JELLYFIED_BIND_ADDRESS:-${JELLYPLEX_BIND_ADDRESS:-0.0.0.0}}:${JELLYFIED_HOST_PORT:-${JELLYPLEX_HOST_PORT:-8080}}:80'
    # The JELLYPLEX_ names are the ones from before the rename; a .env file that still uses them works.
    environment:
      # Jellyfin address as reachable FROM THIS CONTAINER. Jellyfied proxies it at /jellyfin,
      # so the browser only ever talks to Jellyfied (no CORS or mixed-content issues).
      #   Same compose project / docker network:  http://jellyfin:8096
      #   Jellyfin on the Docker host:            http://host.docker.internal:8096
      #   Another machine on your LAN:            http://192.168.1.10:8096
      JELLYFIN_URL: '${JELLYFIN_URL-http://host.docker.internal:8096}'
      # Optional: make the browser talk to Jellyfin directly instead of through the proxy,
      # e.g. https://jellyfin.example.com
      JELLYFIN_PUBLIC_URL: '${JELLYFIN_PUBLIC_URL:-}'
      # Optional: whether users can type a different server address on the login screen.
      JELLYFIED_LOCK_SERVER: '${JELLYFIED_LOCK_SERVER:-${JELLYPLEX_LOCK_SERVER:-}}'
      # Optional: serve Jellyfied under a path, e.g. /jellyfied, behind a reverse proxy.
      JELLYFIED_BASE_PATH: '${JELLYFIED_BASE_PATH:-${JELLYPLEX_BASE_PATH:-}}'
      # Optional: whose X-Forwarded-For header to believe, so Jellyfin sees visitors' own addresses
      # behind a reverse proxy or tunnel. Addresses or networks, or "none". Default: private ranges.
      JELLYFIED_TRUSTED_PROXIES: '${JELLYFIED_TRUSTED_PROXIES:-${JELLYPLEX_TRUSTED_PROXIES:-private}}'
    extra_hosts:
      # Makes host.docker.internal work on Linux too.
      - 'host.docker.internal:host-gateway'

  # If Jellyfin runs in Docker as well, put both on the same network and use
  # JELLYFIN_URL=http://jellyfin:8096, e.g.:
  #
  # jellyfin:
  #   image: jellyfin/jellyfin:latest
  #   container_name: jellyfin
  #   restart: unless-stopped
  #   ports:
  #     - "8096:8096"
  #   volumes:
  #     - ./jellyfin/config:/config
  #     - ./jellyfin/cache:/cache
  #     - /path/to/media:/media:ro
